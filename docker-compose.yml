# Verus (VRSC) CPU miner - SRBMiner-Multi -> Luckpool (AP)
#
# 1. Replace RYourVerusAddressHere below with your VRSC address
# 2. docker compose up -d --build
# 3. docker compose logs -f

services:
  srbminer:
    container_name: srbminer-verus
    build:
      context: .
      dockerfile_inline: |
        FROM debian:bookworm-slim
        RUN apt-get update \
            && apt-get install -y --no-install-recommends ca-certificates curl \
            && rm -rf /var/lib/apt/lists/*
        RUN mkdir -p /opt/srbminer \
            && curl -fsSL https://github.com/doktor83/SRBMiner-Multi/releases/download/3.5.5/SRBMiner-Multi-3-5-5-Linux.tar.gz \
               | tar -xz -C /opt/srbminer --strip-components=1
        WORKDIR /opt/srbminer
    init: true
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        exec /opt/srbminer/SRBMiner-MULTI
        --algorithm verushash
        --pool ap.luckpool.net:3960
        --wallet RCaNK3s5WimS5kgQKvZb7H1Hg2TqeUGrqo.anws
        --password x
        --cpu-threads $$(nproc)
        --disable-gpu
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"# Verus (VRSC) CPU miner - SRBMiner-Multi -> Luckpool (AP)
